name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev gdb
          pip install pytest setuptools gtsam -r requirements.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes src/gnss_fgo/ tests/ examples/
      - name: Unit tests
        run: |
          gdb -batch -ex "run" -ex "frame 7" -ex "info reg" -ex "x/8gx \$rsp" --args python -m pytest tests/test_jacobians.py -k test_nhc_factor -v -s || true
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uv venv --python 3.12.16 /tmp/uvtest
          ~/.local/bin/uv pip install --python /tmp/uvtest/bin/python pytest setuptools gtsam -r requirements.txt
          ~/.local/bin/uv pip install --python /tmp/uvtest/bin/python --no-build-isolation --no-deps -e .
          /tmp/uvtest/bin/pytest tests/ -v -s
          exit 1
