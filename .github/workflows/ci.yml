name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev gdb
          c++ --version
          pip install pytest setuptools gtsam -r requirements.txt
          pip install --no-build-isolation --no-deps -e . -v
      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes src/gnss_fgo/ tests/ examples/
      - name: Unit tests
        run: |
          ldd src/gnss_fgo/_extra_factors*.so
          python -m pytest tests/test_jacobians.py -v -s
          python -m pytest tests/ -v -s
