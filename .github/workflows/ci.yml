name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev gdb
          pip install pytest setuptools gtsam -r requirements.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes src/gnss_fgo/ tests/ examples/
      - name: Unit tests
        run: |
          python -m pytest tests/test_jacobians.py -k test_tdcp_factor -v -s || true
          gdb -batch -ex "set breakpoint pending on" -ex "b *(_ZNK5gtsam16NoiseModelFactor9linearizeERKNS_6ValuesE+0x218)" -ex "run" -ex "info reg rdi rsi rbp rsp" -ex "x/4gx \$rdi-16" -ex "c" -ex "bt" --args python -m pytest tests/test_jacobians.py -k test_nhc_factor -v -s
          exit 1
